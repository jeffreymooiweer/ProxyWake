# Local development build (contributors). For a normal install use the
# docker-compose.yml in the repository root.
services:
  proxywake:
    build:
      context: ..
      dockerfile: Dockerfile
    image: proxywake:local
    container_name: proxywake
    # Bridge networking is fine for development; for real Wake-on-LAN use
    # network_mode: host (see the root docker-compose.yml).
    ports:
      - "${PROXYWAKE_PORT:-8462}:5001"
    env_file:
      - .env
    environment:
      PROXYWAKE_DATA_DIR: /app/backend/data
      TZ: ${TZ:-UTC}
    volumes:
      - proxywake_data:/app/backend/data
    restart: unless-stopped
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  proxywake_data:
